name: Test Formula
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Test Brew
        run: |
          brew tap nxt3r/nportx
          # This bypasses the new trust restriction:
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --formula nxt3r/nportx/nportx
          nportx --version